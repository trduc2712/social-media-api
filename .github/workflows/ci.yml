name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: make build

      - name: Test
        run: make test

  migrate-staging:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/migrate-database.yml
    with:
      environment: Staging
    secrets:
      connection-string: ${{ secrets.STAGING_DATABASE_CONNECTION_STRING }}
