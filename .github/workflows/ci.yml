name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: make build

      - name: Test
        run: make test

  db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=social-media;Username=postgres;Password=postgres
      TBLS_DSN: postgres://postgres:postgres@localhost:5432/social-media?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: social-media
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Apply migrations
        run: make migrate

      - name: Check database docs are up to date
        run: make db-docs-check

      - name: Lint database docs
        run: make db-docs-lint

  migrate-staging:
    needs: [test, db-docs]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/migrate-database.yml
    with:
      environment: Staging
    secrets:
      connection-string: ${{ secrets.STAGING_DATABASE_CONNECTION_STRING }}
